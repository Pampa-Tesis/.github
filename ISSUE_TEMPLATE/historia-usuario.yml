name: Historia de usuario
description: Funcionalidad vista desde quien la usa
title: "feat: "
type: "Historia de usuario"
body:
  - type: textarea
    id: historia
    attributes:
      label: Historia
      description: Como [quién], quiero [qué], para [por qué].
      placeholder: Como astrónomo aficionado, quiero comparar dos culturas, para entender cómo veían el cielo.
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Qué debe cumplirse para dar la historia por terminada.
      placeholder: |
        - [ ] Criterio 1
        - [ ] Criterio 2
  - type: textarea
    id: notas
    attributes:
      label: Notas o dependencias
      description: Enlaces, decisiones previas o issues relacionados.
